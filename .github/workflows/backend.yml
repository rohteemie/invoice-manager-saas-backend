name: Backend CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  POSTGRESQL_VERSION: "14"

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pycodestyle black flake8
          pip install -r requirements.txt

      - name: Run pycodestyle
        run: |
          pycodestyle app/ --count --statistics --max-line-length=88

      - name: Run flake8
        run: |
          flake8 app/ --count --statistics

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env file
        run: |
          cat > .env << EOF
          PROJECT_NAME=Multi-Tenant SaaS Backend
          SECRET_KEY=test_secret_key_for_ci_only
          ACCESS_TOKEN_EXPIRATION=30
          REFRESH_TOKEN_EXPIRATION=10080
          DATABASE_URL=sqlite:///./test.db
          REDIS_URL=redis://localhost:6379/0
          EOF

      - name: Run Alembic migrations
        run: |
          echo "Running Alembic migrations..."
          alembic upgrade head
          echo "Migrations completed successfully"
        env:
          DATABASE_URL: sqlite:///./test.db

      - name: Run Alembic migrations check
        run: |
          alembic check || echo "No pending migrations or alembic not fully configured"

      - name: Run pytest
        run: |
          pytest tests/ -v --tb=short --maxfail=5
        env:
          DATABASE_URL: sqlite:///./test.db
          REDIS_URL: redis://localhost:6379/0

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy (Example)
    runs-on: ubuntu-latest
    needs: [build]
    # This is an example deploy job showing how to run migrations
    # Only runs on main branch AND if DEPLOYMENT_ENABLED variable is set to 'true'
    # To enable: Go to Settings > Variables > New repository variable
    # Name: DEPLOYMENT_ENABLED, Value: true
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOYMENT_ENABLED == 'true'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install alembic psycopg2-binary sqlalchemy pydantic pydantic-settings python-dotenv

      - name: Run database migrations
        run: |
          echo "Running Alembic migrations on production database..."
          alembic upgrade head
          echo "✅ Migrations completed successfully"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # Note: Configure these in repository settings:
        # 1. Variables > DEPLOYMENT_ENABLED = 'true' (to enable this job)
        # 2. Secrets > DATABASE_URL = your production database URL

      # - name: Deploy to production
      #   run: |
      #     echo "Deploying application..."
      #     # Add your deployment commands here (e.g., kubectl, docker-compose, etc.)
